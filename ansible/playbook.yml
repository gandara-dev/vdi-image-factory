---
- name: Customize a Windows VDI golden image
  hosts: golden_image
  gather_facts: false
  vars:
    vdi_factory_root: C:\ProgramData\VdiImageFactory
    vdi_image_version: dev
    vdi_application_profiles:
      - standard
    vdi_include_applications: []
    vdi_exclude_applications: []
    vdi_run_optimizer: false
    vdi_optimizer_engine: C:\CitrixOptimizer\CtxOptimizerEngine.ps1
    vdi_optimizer_template: AutoSelect

  tasks:
    - name: Create the factory directory
      ansible.windows.win_file:
        path: "{{ vdi_factory_root }}"
        state: directory

    - name: Copy the PowerShell module
      ansible.windows.win_copy:
        src: ../src/VdiImageFactory/
        dest: "{{ vdi_factory_root }}\\VdiImageFactory\\"

    - name: Copy the application catalog
      ansible.windows.win_copy:
        src: ../config/application-catalog.json
        dest: "{{ vdi_factory_root }}\\application-catalog.json"

    - name: Install image applications
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module '{{ vdi_factory_root }}\VdiImageFactory\VdiImageFactory.psd1' -Force
          $profiles = @({{ vdi_application_profiles | map('to_json') | join(', ') }})
          $include = @({{ vdi_include_applications | map('to_json') | join(', ') }})
          $exclude = @({{ vdi_exclude_applications | map('to_json') | join(', ') }})
          Install-VdiApplication `
            -CatalogPath '{{ vdi_factory_root }}\application-catalog.json' `
            -ApplicationProfile $profiles `
            -IncludeApplication $include `
            -ExcludeApplication $exclude

    - name: Run Citrix Optimizer
      when: vdi_run_optimizer | bool
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module '{{ vdi_factory_root }}\VdiImageFactory\VdiImageFactory.psd1' -Force
          Invoke-CitrixOptimizer -EnginePath '{{ vdi_optimizer_engine }}' -Template '{{ vdi_optimizer_template }}' -Mode Execute

    - name: Record image metadata and validate seal readiness
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module '{{ vdi_factory_root }}\VdiImageFactory\VdiImageFactory.psd1' -Force
          $profiles = @({{ vdi_application_profiles | map('to_json') | join(', ') }})
          $include = @({{ vdi_include_applications | map('to_json') | join(', ') }})
          $exclude = @({{ vdi_exclude_applications | map('to_json') | join(', ') }})
          $applications = @(Resolve-VdiApplicationCatalog `
            -CatalogPath '{{ vdi_factory_root }}\application-catalog.json' `
            -ApplicationProfile $profiles `
            -IncludeApplication $include `
            -ExcludeApplication $exclude)
          Complete-VdiImage `
            -ManifestPath '{{ vdi_factory_root }}\image-manifest.json' `
            -ImageVersion '{{ vdi_image_version }}' `
            -ApplicationProfile $profiles `
            -ApplicationId @($applications.Id)
